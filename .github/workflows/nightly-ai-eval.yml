name: Nightly Live AI Model Evaluation

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  live-eval:
    name: Live Groq Model Evaluation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Live Groq Model Benchmark
        run: npx tsx scripts/ci-ai-eval-gate.ts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
